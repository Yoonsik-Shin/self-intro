plugins {
    id 'java-library'
    id 'org.springframework.boot'
}


bootJar {
    enabled = true
    archiveClassifier = ''
}

jar {
    enabled = true
    archiveClassifier = 'plain'
}

configurations {
    playwrightRuntime
}


dependencies {
    api project(':api')
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'io.micrometer:micrometer-registry-prometheus'
    api 'io.micrometer:micrometer-tracing-bridge-otel'
    api 'io.opentelemetry:opentelemetry-exporter-otlp'
    api 'org.springframework.boot:spring-boot-starter-aop'
    api 'org.springframework.ai:spring-ai-starter-model-openai'
    api 'org.jsoup:jsoup:1.17.2'
    api 'com.microsoft.playwright:playwright:1.52.0'
    playwrightRuntime 'com.microsoft.playwright:playwright:1.52.0'

    // Oracle ATP & Vector Search (ojdbc11 + PKI for Wallet)
    implementation 'com.oracle.database.jdbc:ojdbc11:23.4.0.24.05'
    implementation 'com.oracle.database.security:oraclepki:23.4.0.24.05'
    // 1차(기본) 데이터소스가 MySQL로 바뀌면서(2026-08-04) ai-worker 자체 실행에도 필요해졌다.
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'



    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

tasks.register('copyPlaywrightClasspath', Copy) {
    from configurations.playwrightRuntime
    into layout.buildDirectory.dir('playwright-classpath')
}

