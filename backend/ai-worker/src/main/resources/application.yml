server:
  port: ${SERVER_PORT:8081}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: self-intro-ai-worker
  datasource:
    url: ${DB_URL:jdbc:h2:mem:workerdb;MODE=Oracle}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:dummy-key-for-local-dev}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

app:
  ai:
    base-url: ${NVIDIA_API_BASE_URL:https://integrate.api.nvidia.com}
    api-key: ${NVIDIA_API_KEY:dummy-key-for-local-dev}
    model: ${NVIDIA_MODEL:nvidia/nemotron-3-super-120b-a12b}
    vision-model: ${NVIDIA_VISION_MODEL:meta/llama-3.2-11b-vision-instruct}
    max-output-tokens: ${NVIDIA_MAX_OUTPUT_TOKENS:8192}
    json-response-format: ${NVIDIA_JSON_RESPONSE_FORMAT:false}
