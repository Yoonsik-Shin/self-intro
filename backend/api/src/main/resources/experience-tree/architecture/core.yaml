  - { stableKey: architecture.transaction.saga, title: "Saga", summary: "로컬 트랜잭션과 보상 작업으로 업무를 수렴시킨다.", mechanism: "단계별 continuation과 실패 시 compensation을 실행한다.", applicableWhen: "서비스별 저장소와 최종 일관성을 허용할 때", avoidWhen: "업무상 보상이 불가능하거나 중간 상태 노출이 금지될 때", advantages: "장기 잠금 없이 서비스 자율성을 유지한다.", disadvantages: "보상, 중복, 관측, 상태 머신이 복잡하다.", operationalNotes: "각 단계와 보상을 멱등하게 설계한다.", displayOrder: 20, tradeoffs: [{ criterion: AVAILABILITY, level: HIGH, explanation: "장기 분산 잠금 없이 단계별 회복이 가능하다.", displayOrder: 10 }] }
