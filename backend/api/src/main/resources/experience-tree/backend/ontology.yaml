stableKey: backend.language.selection
domain: BACKEND
topic: LANGUAGE_SELECTION
title: "기능과 운영 조건에 따라 백엔드 언어를 어떻게 선택할 것인가"
summary: "팀의 숙련도만이 아니라 지연 특성, 동시성, 생태계, 배포와 장애 진단 비용을 함께 비교한다."
problem: "언어 선택이 초기 개발 속도만 최적화하고 서비스 수명 전체의 성능·채용·관측·운영 비용을 악화시키지 않아야 한다."
contextMarkdown: |
  ## 언어 선택은 벤치마크 순위가 아니라 제약 조건의 교집합이다

  언어 자체의 평균 처리량보다 먼저 **업무 실패 비용과 운영 환경**을 확인한다. 결제처럼 복잡한
  트랜잭션과 장기간 유지되는 도메인은 정적 타입, 프레임워크 성숙도와 디버깅 가능성이 중요하다.
  반면 작은 네트워크 에이전트는 메모리 상한, 단일 바이너리 배포와 빠른 시작 시간이 더 중요할 수 있다.

  | 질문 | 신호 | 선택에 미치는 영향 |
  |---|---|---|
  | 요청은 CPU-bound인가 I/O-bound인가 | CPU flame graph, 외부 호출 대기 비율 | 런타임보다 병렬화·backpressure 모델이 중요해진다 |
  | p99 지연과 메모리 상한은 얼마인가 | SLO, container limit | GC·JIT·프로세스 모델을 함께 본다 |
  | 어떤 라이브러리가 필수인가 | DB driver, ML, 보안 인증 모듈 | 생태계 부재는 직접 구현과 보안 책임으로 전환된다 |
  | 누가 3년간 운영하는가 | 팀 숙련도, on-call, 채용 시장 | 낯선 언어의 학습 비용보다 장애 진단 비용이 더 크다 |
  | 배포 단위는 무엇인가 | Kubernetes, edge, Lambda, CLI | 시작 시간·바이너리 크기·runtime 설치 조건이 달라진다 |

  ```mermaid
  flowchart TD
      A[업무와 SLO 정의] --> B{필수 생태계가 있는가?}
      B -- 아니오 --> C[지원되는 언어 후보만 유지]
      B -- 예 --> D{CPU 병렬 계산이 핵심인가?}
      D -- 예 --> E[Go / Java / Rust 등 병렬 실행 후보]
      D -- 아니오 --> F{I/O 동시성과 빠른 제품 실험이 핵심인가?}
      F -- 예 --> G[Java Virtual Threads / Kotlin / Node.js / Python async]
      F -- 아니오 --> H[팀 표준 언어 우선]
      C --> I[대표 workload spike]
      E --> I
      G --> I
      H --> I
      I --> J[p50/p99, RSS, CPU, 장애 진단 비교]
  ```

  ## 같은 HTTP 기능도 실행 모델이 다르다

  다음 코드는 외부 API 두 개를 병렬 호출한다. 문법보다 중요한 차이는 취소, timeout, context
  전파와 관측 도구가 이 실행 단위를 어떻게 보여주는가이다.

  ```java
  // Java 21: virtual thread마다 익숙한 blocking 코드를 유지한다.
  try (var scope = new StructuredTaskScope.ShutdownOnFailure()) {
      var profile = scope.fork(() -> profileClient.fetch(userId));
      var orders  = scope.fork(() -> orderClient.fetch(userId));
      scope.joinUntil(Instant.now().plusMillis(300));
      scope.throwIfFailed();
      return new Dashboard(profile.get(), orders.get());
  }
  ```

  ```go
  // Go: context 취소를 모든 goroutine과 client 호출로 전달해야 한다.
  group, ctx := errgroup.WithContext(ctx)
  group.Go(func() error { profile, err = fetchProfile(ctx, userID); return err })
  group.Go(func() error { orders, err = fetchOrders(ctx, userID); return err })
  if err := group.Wait(); err != nil { return Dashboard{}, err }
  return Dashboard{Profile: profile, Orders: orders}, nil
  ```

  ```ts
  // Node.js: Promise.all만으로 하위 네트워크 요청이 자동 취소되지는 않는다.
  const signal = AbortSignal.timeout(300);
  const [profile, orders] = await Promise.all([
    fetchProfile(userId, { signal }),
    fetchOrders(userId, { signal }),
  ]);
  return { profile, orders };
  ```

  ## 검증 방법

  후보를 정한 뒤 toy benchmark 대신 대표 endpoint 하나를 수직으로 구현한다. 동일한 DB pool,
  timeout, payload와 container limit에서 부하를 재현하고 다음을 함께 기록한다.

  1. 정상 부하의 처리량과 p50/p95/p99
  2. 하위 API가 느릴 때 thread·event-loop·goroutine의 증가와 취소 여부
  3. 메모리 RSS, GC pause, CPU throttling
  4. trace·profile·heap dump로 원인을 찾는 데 걸린 시간
  5. 빌드, 보안 패치, 배포 이미지와 on-call runbook의 복잡도
constraintsMarkdown: |
  - 필수 SDK와 검증된 DB·메시지 드라이버가 존재하는가
  - CPU·메모리·시작 시간과 p99 SLO가 수치로 정의됐는가
  - 팀이 production profiling, heap·goroutine·event-loop 진단을 수행할 수 있는가
  - polyglot 도입 시 공통 인증·관측·배포·보안 패치 체계를 제공할 수 있는가
