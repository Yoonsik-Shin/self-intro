stableKey: backend.database.engine-selection
domain: BACKEND
topic: DATABASE_SELECTION
title: "데이터 모델과 접근 패턴에 맞는 데이터베이스를 어떻게 선택할 것인가"
summary: "RDBMS, 문서, 키-값 저장소를 유행이 아니라 불변식·질의·확장·복구 요구로 선택한다."
problem: "저장소가 현재 쓰기 형태에는 편하지만 핵심 불변식, 미래 조회, 장애 복구와 운영 역량을 감당하지 못하는 상황을 피해야 한다."
contextMarkdown: |
  ## 제품명이 아니라 데이터의 책임부터 정의한다

  먼저 한 문장으로 **동시에 참이어야 하는 불변식**을 적는다. 주문 생성과 재고 차감이 함께 성공해야
  하고 임의 조건으로 탐색한다면 관계형 DB가 강한 기본값이다. 세션처럼 키 하나로 읽고 TTL 후 사라지는
  데이터라면 key-value가 더 직접적이다. 문서 전체가 하나의 aggregate로 함께 변경되고 필드 모양이
  다양하다면 document store를 검토한다.

  | 판단 축 | 관계형 DB | Document store | Key-value |
  |---|---|---|---|
  | 핵심 접근 | 조건·조인·집계 | 문서 키와 문서 내부 필드 | primary key |
  | 불변식 | 제약조건·트랜잭션 | 문서 단위 원자성 중심 | 키·명령 단위 원자성 중심 |
  | 스키마 진화 | 명시적 migration | reader/writer 호환 규율 | value 포맷 버전 필요 |
  | 수평 확장 | replica·partition·sharding | shard key 중심 | partitioning이 자연스러움 |
  | 대표 실패 | 긴 트랜잭션·hot row | 잘못된 shard key·무제한 문서 | TTL·eviction·메모리 고갈 |

  ```mermaid
  flowchart TD
      A[업무 불변식과 접근 패턴] --> B{여러 엔티티를 원자적으로 변경?}
      B -- 예 --> R[RDBMS를 기본 후보로]
      B -- 아니오 --> C{조회가 거의 key lookup인가?}
      C -- 예 --> K[Key-value 후보]
      C -- 아니오 --> D{aggregate 전체를 함께 읽고 쓰는가?}
      D -- 예 --> M[Document store 후보]
      D -- 아니오 --> R
      R --> E[실제 쿼리와 데이터 분포 검증]
      K --> E
      M --> E
      E --> F[백업 복원·장애 전환·비용 실험]
  ```

  ## 같은 주문 데이터의 모델 차이

  관계형 모델은 DB가 참조와 금액 조건을 강제한다.

  ```sql
  CREATE TABLE orders (
    id bigint PRIMARY KEY,
    customer_id bigint NOT NULL REFERENCES customers(id),
    status varchar(20) NOT NULL CHECK (status IN ('PENDING','PAID','CANCELLED')),
    total_amount numeric(19,2) NOT NULL CHECK (total_amount >= 0),
    version bigint NOT NULL
  );
  CREATE INDEX idx_orders_customer_created
    ON orders(customer_id, created_at DESC, id DESC);
  ```

  문서 모델은 aggregate를 한 번에 읽지만 배열이 무제한 증가하지 않도록 경계를 정해야 한다.

  ```json
  {
    "_id": "order-1024",
    "schemaVersion": 3,
    "customerId": "customer-7",
    "status": "PAID",
    "lines": [{ "sku": "A-1", "quantity": 2, "unitPrice": 12000 }],
    "totalAmount": 24000
  }
  ```

  키-값 모델은 의도적인 단일 접근 경로에서 강하다.

  ```text
  SET session:8f1... '{"userId":7,"roles":["ADMIN"],"v":2}' EX 1800 NX
  GET session:8f1...
  ```

  ## 선택 검증 체크리스트

  1. 상위 10개 읽기·쓰기 query를 실제 형태와 빈도로 적는다.
  2. 데이터 크기뿐 아니라 tenant·시간·key별 분포와 hot partition을 만든다.
  3. 일관성 수준, 허용 가능한 stale 시간과 conflict 해결 주체를 정한다.
  4. 백업을 실제 복원하고 RPO·RTO, index 재구성 시간과 비용을 측정한다.
  5. CDC, 검색, 분석 때문에 결국 두 번째 저장소가 필요하다면 원본 소유권과 재구축 경로를 명시한다.
constraintsMarkdown: |
  - 업무 불변식을 애플리케이션과 저장소 중 누가 강제하는가
  - 예상 query와 정렬·집계·조인이 목록으로 정리됐는가
  - partition key의 cardinality와 hot key 분포를 검증했는가
  - 백업 복원, 장애 전환과 schema migration을 팀이 직접 운영할 수 있는가
