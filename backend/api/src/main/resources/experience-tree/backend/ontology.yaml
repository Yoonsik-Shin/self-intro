stableKey: backend.runtime.execution-model
domain: BACKEND
topic: RUNTIME_MODEL
title: "요청 처리의 동시성 실행 모델을 어떻게 선택할 것인가"
summary: "플랫폼 스레드, 가상 스레드, 이벤트 루프·리액티브 모델의 처리량보다 blocking 경계와 backpressure 책임을 비교한다."
problem: "느린 I/O와 부하 급증이 실행 단위, 커넥션 풀과 메모리를 무제한 점유해 전체 서비스 장애로 번지지 않아야 한다."
contextMarkdown: |
  ## 실행 모델은 동시성 한도를 없애지 않는다

  가상 스레드나 event loop는 대기 비용을 줄일 수 있지만 DB connection, 하위 API quota와 CPU는 그대로
  제한돼 있다. 따라서 `동시에 시작할 수 있는 작업 수`와 `희소 자원을 사용하는 작업 수`를 분리한다.

  ```mermaid
  flowchart LR
      R[HTTP requests] --> C{실행 모델}
      C --> P[Platform thread pool]
      C --> V[Virtual threads]
      C --> E[Event loop / Reactive]
      P --> L[Concurrency limiter]
      V --> L
      E --> L
      L --> D[(DB pool 30)]
      L --> X[External API quota 100]
  ```

  | 모델 | 대기 표현 | 장점 | 반드시 통제할 것 |
  |---|---|---|---|
  | 플랫폼 스레드 | thread가 blocking | 단순한 stack과 넓은 호환성 | thread pool·queue 상한 |
  | 가상 스레드 | 저비용 virtual thread가 blocking | imperative 코드 유지, 높은 I/O 동시성 | pinning, DB·API semaphore |
  | 이벤트 루프 | callback·Promise completion | 적은 thread와 높은 socket 동시성 | event loop 차단, CPU 작업 격리 |
  | 리액티브 스트림 | 비동기 signal pipeline | end-to-end backpressure·stream 조합 | 전체 라이브러리 non-blocking 여부, context·debugging |

  ## 희소 자원 앞에는 별도 bulkhead가 필요하다

  ```java
  // virtual thread를 요청마다 만들어도 DB 작업은 pool 용량 이하로 제한한다.
  private final Semaphore databaseBulkhead = new Semaphore(30);

  Order loadOrder(long id) throws Exception {
      if (!databaseBulkhead.tryAcquire(50, TimeUnit.MILLISECONDS)) {
          throw new ServiceUnavailableException("database concurrency exhausted");
      }
      try {
          return orderRepository.findById(id).orElseThrow();
      } finally {
          databaseBulkhead.release();
      }
  }
  ```

  ```ts
  // event loop에서 CPU 작업은 worker로 넘기고 queue 자체에도 상한을 둔다.
  const result = await workerPool.run(job, {
    queueTimeoutMs: 50,
    executionTimeoutMs: 500,
  });
  ```

  ## 장애 조건으로 부하 테스트한다

  정상 응답만 빠르게 주는 benchmark는 실행 모델을 검증하지 못한다. 하위 API 지연을 50ms에서 3초로
  올리고 DB pool을 고갈시키며 client disconnect를 발생시킨다. 이때 active task, queue depth,
  event-loop lag, pinned thread, connection wait와 취소된 하위 요청 수를 관측한다.
constraintsMarkdown: |
  - 사용하는 DB·HTTP·파일 라이브러리가 blocking인지 non-blocking인지 목록화했는가
  - DB pool, 외부 API quota와 CPU worker의 동시성 예산이 분리돼 있는가
  - client 취소와 deadline이 하위 작업까지 전파되는가
  - queue depth와 대기 timeout이 유한하며 overload 시 빠르게 실패하는가
