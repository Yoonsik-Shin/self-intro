spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: self-intro-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.tracing.BraveAutoConfiguration

  http:
    client:
      # NVIDIA NIM 호출(특히 비전 모델, 그리고 항목별로 자가점검 질문까지 함께 생성하는 학습
      # 계획 생성처럼 출력이 큰 호출)이 응답 없이 멈출 때 요청 스레드가 무한정 붙잡히지 않도록
      # 상한을 둔다. 배너 이미지 멀티이미지 비전 호출이 90초를 넘기는 경우가 있고, 학습 계획
      # 생성은 그보다도 오래 걸리는 걸 확인해서 여유를 더 뒀다.
      connect-timeout: 5s
      read-timeout: 300s
  ai:
    model:
      chat: openai
    retry:
      max-attempts: 1
    openai:
      base-url: ${NVIDIA_API_BASE_URL:https://integrate.api.nvidia.com}
      api-key: ${NVIDIA_API_KEY:not-configured}
      chat:
        options:
          model: ${NVIDIA_MODEL:nvidia/nemotron-3-super-120b-a12b}
          temperature: 0.2
          top-p: 0.9
          max-tokens: ${NVIDIA_MAX_OUTPUT_TOKENS:4096}
      embedding:
        enabled: false
  datasource:
    url: ${DB_URL:jdbc:h2:mem:selfintro;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    ignore-migration-patterns: "*:ignored"
    placeholder-replacement: false
    # 여러 세션/브랜치에서 동시에 마이그레이션 번호를 매기다 보면 이미 배포된 더 높은 버전보다
    # 낮은 번호가 뒤늦게 합쳐지는 경우가 생긴다(2026-08-04 V150 사고). 기본값(false)이면 그런
    # 마이그레이션은 조용히 스킵되어 스키마가 조용히 어긋난다 — out-of-order를 켜서 낮은 번호도
    # 반드시 적용되게 한다.
    out-of-order: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:false}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  session:
    store-type: ${SPRING_SESSION_STORE_TYPE:none}

management:
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  file:
    name: ${LOG_FILE_PATH:}
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}]"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-},%X{spanId:-}] --- [%t] %-40.40logger{39} : %m%n"

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cookie-domain: ${COOKIE_DOMAIN:}
  visitor:
    cookie-secure: ${VISITOR_COOKIE_SECURE:false}
    time-zone: ${VISITOR_TIME_ZONE:Asia/Seoul}
    excluded-ips: ${VISITOR_EXCLUDED_IPS:}
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
  ai:
    base-url: ${NVIDIA_API_BASE_URL:https://integrate.api.nvidia.com}
    api-key: ${NVIDIA_API_KEY:}
    model: ${NVIDIA_MODEL:nvidia/nemotron-3-super-120b-a12b}
    # 채용공고가 텍스트 대신 배너 이미지로만 정보를 제공할 때 JobApplicationUrlParseService가
    # 보조로 호출하는 비전 모델. 재배포 없이 바꿀 수 있도록 코드에 기본값을 두지 않고 환경변수로만 관리한다.
    vision-model: ${NVIDIA_VISION_MODEL:meta/llama-3.2-11b-vision-instruct}

    max-output-tokens: ${NVIDIA_MAX_OUTPUT_TOKENS:8192}
    # Qwen3.5 NIM 엔드포인트는 response_format 지정 시 빈 응답을 반환했음.
    # Nemotron으로 교체 후 정상 동작 여부를 재검증하고 필요 시 true로 전환할 것.
    json-response-format: ${NVIDIA_JSON_RESPONSE_FORMAT:false}
  # 사람인 access-key(비밀값)만 환경변수로 관리한다. 사용 여부/검색 키워드/개수/정렬/
  # 지역·직무·업종 코드/매칭 임계치/수집 스케줄 cron은 재배포 없이 바꿀 수 있도록
  # job_posting_setting 테이블(어드민 설정 화면, JobPostingSettingRepository)에서 관리한다.
  job-posting:
    # 백엔드 인스턴스 하나가 동시에 처리할 URL 수집 작업 수. 다중 수집 입력 상한은 5이지만
    # NVIDIA NIM 공유 워커가 순간 동시 요청 몰림에 503 ResourceExhausted를 반환하는 사례가
    # 확인되어 기본값을 3으로 낮춰 한 번에 3건씩만 실제 병렬 호출되게 한다.
    scheduler-enabled: ${JOB_POSTING_SCHEDULER_ENABLED:true}
    ingest-concurrency: ${JOB_POSTING_INGEST_CONCURRENCY:3}
    saramin:
      access-key: ${SARAMIN_ACCESS_KEY:}
  donation:
    kofi:
      page-url: ${KOFI_PAGE_URL:https://ko-fi.com}
      verification-token: ${KOFI_VERIFICATION_TOKEN:}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    # 브라우저가 presigned URL로 직접 PUT할 때 접속할 호스트. 로컬(docker-compose)처럼
    # 백엔드 컨테이너와 브라우저가 서로 다른 호스트명으로 접근해야 할 때만 endpoint와
    # 다르게 지정하고, 그 외(운영)에는 endpoint와 동일하므로 값을 지정하지 않아도 된다.
    presigned-endpoint: ${STORAGE_PRESIGNED_ENDPOINT:${STORAGE_ENDPOINT:http://localhost:9000}}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:self-intro-images}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    path-style-access: ${STORAGE_PATH_STYLE_ACCESS:true}
    presigned-upload-ttl-seconds: ${STORAGE_PRESIGNED_TTL_SECONDS:300}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/self-intro-images}
  experience-tree:
    # Git에 버전 관리되는 정적 카탈로그를 stable key 기준으로 멱등 동기화한다.
    # 긴급 시 false로 내려 기존 DB read model만 제공할 수 있다.
    import-enabled: ${EXPERIENCE_TREE_IMPORT_ENABLED:true}

kakao:
  # job_posting 좌표 지오코딩 1순위 provider. 비어있으면 OSM Nominatim만 쓰는데, 국내 상세 건물
  # 단위 주소 커버리지가 부실해서 매칭 실패율이 매우 높다(2026-08-06, 106건 중 12건만 성공).
  rest-api-key: ${KAKAO_REST_API_KEY:}

oracle:
  # job_posting_vector 등 Oracle 26ai 2차 데이터소스(oracle.vector.datasource)는 여기 없다 — api는
  # com.selfintro.vectorsearch를 스캔에서 제외해서 더 이상 Oracle 연결이 필요 없다(2026-08 job-posting
  # CRUD/AI 분리 완료, worker만 벡터 검색을 씀). 예전엔 2026-08-04 사고 대응으로 여기도 배선했었다.
  nosql:
    enabled: ${ORACLE_NOSQL_ENABLED:false}
    mode: ${ORACLE_NOSQL_MODE:cloud}
    endpoint: ${ORACLE_NOSQL_ENDPOINT:https://nosql.ap-chuncheon-1.oci.oraclecloud.com}
    compartment-id: ${ORACLE_NOSQL_COMPARTMENT_ID:}
    oci-config-file: ${ORACLE_OCI_CONFIG_FILE:~/.oci/config}
    profile-name: ${ORACLE_OCI_PROFILE:self-intro-api-key}
    table-name: ${ORACLE_NOSQL_TABLE:JobPostingReadModel}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:0}
  client:
    jobPostingService:
      address: ${GRPC_WORKER_HOST:static://localhost:9090}
      negotiation-type: plaintext
    workspaceVectorService:
      address: ${GRPC_WORKER_HOST:static://localhost:9090}
      negotiation-type: plaintext

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 12h
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
