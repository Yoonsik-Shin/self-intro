plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

configurations {
    playwrightRuntime
}

dependencies {
    implementation project(':core')
    implementation project(':ai-worker')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.session:spring-session-data-redis'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    playwrightRuntime 'com.microsoft.playwright:playwright:1.52.0'
    
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

bootJar {
    enabled = true
}

jar {
    enabled = false
}

tasks.register('copyPlaywrightClasspath', Copy) {
    from configurations.playwrightRuntime
    into layout.buildDirectory.dir('playwright-classpath')
}
