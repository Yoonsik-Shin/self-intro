plugins {
    id 'java-library'
    id 'com.google.protobuf'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.62.2'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    api 'org.springframework.session:spring-session-data-redis'
    api 'org.springframework.boot:spring-boot-starter-amqp'
    api 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    api 'org.springframework.ai:spring-ai-starter-model-openai'
    api 'org.flywaydb:flyway-core'
    api 'software.amazon.awssdk:s3'
    api 'software.amazon.awssdk:url-connection-client'
    api 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    api 'com.oracle.nosql.sdk:nosqldriver:5.4.15'
    
    api 'io.grpc:grpc-netty-shaded:1.62.2'
    api 'io.grpc:grpc-protobuf:1.62.2'
    api 'io.grpc:grpc-stub:1.62.2'
    api 'com.google.protobuf:protobuf-java-util:3.25.3'
    api 'net.devh:grpc-spring-boot-starter:3.1.0.RELEASE'
    api 'javax.annotation:javax.annotation-api:1.3.2'
    
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
