contextMarkdown: "IaC는 코드만 작성하는 것이 아니라 plan 검토, 상태 보호, drift 탐지와 긴급 변경 회수 절차를 포함한다."
constraintsMarkdown: "- 상태 저장소\n- 비밀값\n- 환경 분리\n- 긴급 변경 절차"
