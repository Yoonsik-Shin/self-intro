name: Deploy API Microservice

on:
  push:
    branches:
      - main
    paths:
      - 'backend/api/**'
      - 'backend/core/**'
      # api 모듈이 ai-worker를 implementation 의존성으로 물고 있어(build.gradle) worker 전용 코드도
      # api 이미지에 그대로 번들된다 — ai-worker만 바뀐 커밋이 api 재배포 트리거를 놓친 사고(2026-08-04) 대응.
      - 'backend/ai-worker/**'
      - 'backend/build.gradle'
      - 'backend/Dockerfile.api'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-push-api:
    runs-on: ubuntu-24.04-arm
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify API quality gate
        working-directory: backend
        run: ./gradlew spotlessCheck :api:test --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: buildx

      - name: Log in to OCI Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCI_REGISTRY || 'yny.ocir.io' }}
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Set short git commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # type=gha 레이어 캐시는 소스 COPY 뒤에 있는 gradle build RUN 레이어를 커버 못한다
      # (코드 바뀌면 항상 무효화됨). RUN --mount=type=cache=/root/.gradle 자체는 gha 백엔드가
      # 저장 못 하는 buildkit 로컬 캐시라, cache-dance로 actions/cache에 별도 영속시켜야 한다.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        id: gradle-cache
        with:
          path: gradle-cache
          key: gradle-api-${{ hashFiles('backend/**/build.gradle', 'backend/gradle.properties') }}
          restore-keys: |
            gradle-api-

      - name: Restore Gradle cache into Docker build
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "gradle-cache": "/root/.gradle"
            }
          skip-extraction: ${{ steps.gradle-cache.outputs.cache-hit }}

      - name: Build and Push API Docker Image (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.api
          platforms: linux/arm64
          push: true
          tags: |
            yny.ocir.io/axrywc89b6lf/self-intro/backend:${{ steps.vars.outputs.sha_short }}
            yny.ocir.io/axrywc89b6lf/self-intro/backend:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Update Kustomization API Image Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            sed -i '/name: self-intro-backend$/,/newTag:/s/newTag: .*/newTag: "${{ steps.vars.outputs.sha_short }}"/' deploy/k8s/overlays/prod/backend/kustomization.yaml
            git add deploy/k8s/overlays/prod/backend/kustomization.yaml
            git commit -m "[bot] Update backend API image tag to ${{ steps.vars.outputs.sha_short }}" || exit 0
            if git push origin main; then
              exit 0
            fi
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
