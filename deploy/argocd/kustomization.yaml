apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  - ingress.yaml

# 무료 티어 노드(1대)의 리소스 고갈을 막기 위한 주요 컴포넌트 리소스 타이트 제어 패치
patches:
  - target:
      kind: Deployment
      name: argocd-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
  - target:
      kind: Deployment
      name: argocd-repo-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
  - target:
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 300m
            memory: 512Mi
  # SealedSecret은 컨트롤러가 풀어야 진짜 Secret이 되는 정적 암호화 값이라
  # 자체 런타임 헬스 상태가 없음. ArgoCD가 헬스체크 방법을 몰라서 기본값으로
  # Degraded 취급 - SealedSecret 쓰는 앱마다 표시만 Degraded로 잘못 뜨는 걸 방지.
  - target:
      kind: ConfigMap
      name: argocd-cm
    patch: |-
      - op: add
        path: /data/resource.customizations.health.bitnami.com_SealedSecret
        value: |
          hs = {}
          hs.status = "Healthy"
          hs.message = "SealedSecret has no runtime health status - it is a static encrypted value unsealed by the controller"
          return hs
