apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-intro-redis
spec:
  template:
    spec:
      priorityClassName: self-intro-critical
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: self-intro.io/node-role
                    operator: In
                    values: [primary, secondary, burst]
