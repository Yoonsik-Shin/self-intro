# Documentation input only. This is not a kubectl manifest and is not active.
fixedNodePools:
  - name: fixed-primary
    autoscalerManaged: false
    size: 1
    labels:
      self-intro.io/node-role: primary
  - name: fixed-secondary
    autoscalerManaged: false
    size: 1
    labels:
      self-intro.io/node-role: secondary
burstNodePool:
  name: burst
  nodePoolOcid: <BURST_NODE_POOL_OCID>
  minNodes: 0
  maxNodes: 1
  labels:
    self-intro.io/node-role: burst
clusterAutoscaler:
  deploymentReplicas: 2
  # OKE Cluster Autoscaler add-on configuration arguments. Register only the
  # burst pool; fixed-primary and fixed-secondary must never appear here.
  addonArguments:
    nodes: "0:1:<BURST_NODE_POOL_OCID>"
    maxNodeProvisionTime: "25m"
    scaleDownDelayAfterAdd: "10m"
    scaleDownUnneededTime: "15m"
    maxNodesTotal: "3"
  placement:
    runOnlyOnFixedNodes: true
    spreadAcrossFixedPools: true
metricsServer:
  required: true
