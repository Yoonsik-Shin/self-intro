apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: self-intro

resources:
  - ../../../base/backend
  - ../../../base/redis
  - ingress.yaml
  - sealed-db-secret.yaml
  - sealed-auth-secret.yaml
  - sealed-ai-secret.yaml
  - sealed-storage-secret.yaml
  - sealed-mail-secret.yaml
  - sealed-billing-secret.yaml
  - sealed-kofi-secret.yaml
  - sealed-oci-api-static-reader-bootstrap.yaml
  - hpa.yaml

patches:
  - path: patch-api-static-secrets.yaml
  - path: patch-scheduling.yaml

images:
  - name: self-intro-backend
    newName: yny.ocir.io/axrywc89b6lf/self-intro/backend
    newTag: "24887fc"
  - name: self-intro-backend-worker
    newName: yny.ocir.io/axrywc89b6lf/self-intro/backend-worker
    newTag: "24887fc"


configMapGenerator:
  - name: api-static-secret-manifest
    files:
      - static-secret-manifest.env
  - name: backend-config
    literals:
      # TODO: frontend-next를 staging.unbrdn.me에서 검증하는 동안만 임시로 추가함.
      # 컷오버 끝나고 staging 검증이 더 이상 필요 없어지면 이 origin은 제거할 것.
      - CORS_ALLOWED_ORIGINS=https://unbrdn.me,https://www.unbrdn.me,https://staging.unbrdn.me
      - JOB_POSTING_SCHEDULER_ENABLED=false
      - JPA_DDL_AUTO=none
      - COOKIE_DOMAIN=unbrdn.me
      - VISITOR_COOKIE_SECURE=true
      - SESSION_COOKIE_SECURE=true
      - SESSION_COOKIE_SAME_SITE=lax
      - NVIDIA_API_BASE_URL=https://integrate.api.nvidia.com
      - NVIDIA_MODEL=nvidia/nemotron-3-super-120b-a12b
      - NVIDIA_MAX_OUTPUT_TOKENS=8192
      - NVIDIA_VISION_MODEL=nvidia/nemotron-nano-12b-v2-vl
      - KOFI_PAGE_URL=https://ko-fi.com/yoonsik
      - STORAGE_ENDPOINT=https://axrywc89b6lf.compat.objectstorage.ap-chuncheon-1.oraclecloud.com
      - STORAGE_REGION=ap-chuncheon-1
      - STORAGE_BUCKET=self-intro-images
      - STORAGE_PRIVATE_BUCKET=self-intro-private
      - STORAGE_PATH_STYLE_ACCESS=true
      - STORAGE_PRESIGNED_TTL_SECONDS=300
      - STORAGE_PRESIGNED_DOWNLOAD_TTL_SECONDS=900
      - STORAGE_PUBLIC_BASE_URL=https://axrywc89b6lf.compat.objectstorage.ap-chuncheon-1.oraclecloud.com/self-intro-images
      - SPRING_SESSION_STORE_TYPE=redis
      - REDIS_HOST=self-intro-redis
      - REDIS_PORT=6379
      # OCI Email Delivery(ap-chuncheon-1) 465 포트는 implicit TLS를 사용한다. SMTP
      # username/password는 이 ConfigMap이 아니라 별도 backend-mail-secret으로 주입한다.
      - SPRING_MAIL_HOST=smtp.email.ap-chuncheon-1.oci.oraclecloud.com
      - SPRING_MAIL_PORT=465
      - SPRING_MAIL_SMTP_AUTH=true
      - SPRING_MAIL_SMTP_SSL_ENABLE=true
      - SPRING_MAIL_SMTP_STARTTLS_ENABLE=false
      - REGISTRATION_EMAIL_ENABLED=true
      - REGISTRATION_EMAIL_FROM=no-reply@unbrdn.me
      - ACCOUNT_RECOVERY_EMAIL_ENABLED=true
      - ACCOUNT_RECOVERY_EMAIL_FROM=no-reply@unbrdn.me
      - REGISTRATION_VERIFICATION_BASE_URL=https://unbrdn.me/signup/verify
      - PASSWORD_RESET_BASE_URL=https://unbrdn.me/password-reset
      - EMAIL_CHANGE_BASE_URL=https://unbrdn.me/account/email-change
      - REGISTRATION_INVITATION_SIGNUP_BASE_URL=https://unbrdn.me/signup
      - WORKSPACE_INVITATION_ACCEPT_BASE_URL=https://unbrdn.me/workspace-invitations
      - REGISTRATION_TERMS_VERSION=2026-08-22
      - REGISTRATION_PRIVACY_VERSION=2026-08-22
      - REGISTRATION_MARKETING_VERSION=2026-08-22
      # 외부 AI 처리 조건을 확정하고 별도 동의를 받기 전까지 비공개 베타에서는 호출 자체를 차단한다.
      - AI_GENERATION_ENABLED=false
      # 비공개 베타 예외는 정확히 PLATFORM_OWNER + 아래 Workspace 조합에만 적용한다.
      # 전역 AI/결제 gate는 계속 false로 유지한다.
      - PLATFORM_OWNER_PREVIEW_ENABLED=true
      - PLATFORM_OWNER_PREVIEW_WORKSPACE_SLUGS=w-199d6de326de71385a98
      # API의 읽기 전용 Vector inventory client. 삭제 RPC는 노출하지 않는다.
      - GRPC_WORKER_HOST=static://self-intro-backend-worker:9090
      - WORKER_BASE_URL=http://self-intro-backend-worker:8081
      - WORKSPACE_DELETION_GRACE_PERIOD=30d
      # 로컬 rehearsal은 통과했다. 운영 backup/provider 증적 gate 승인 전까지 모두 잠근다.
      - WORKSPACE_PURGE_EXECUTION_ENABLED=false
      - WORKSPACE_PURGE_EXECUTION_CRON=0 */10 * * * *
      - WORKSPACE_PURGE_TIME_ZONE=Asia/Seoul
      - WORKSPACE_PURGE_LEASE_TIMEOUT=2h
      - WORKSPACE_PURGE_BATCH_SIZE=10
      - WORKSPACE_PURGE_OBJECT_STORAGE_DELETE_ENABLED=false
      - WORKSPACE_PURGE_MYSQL_DELETE_ENABLED=false
      - WORKSPACE_PURGE_VECTOR_DELETE_ENABLED=false
      - WORKSPACE_PURGE_CACHE_DELETE_ENABLED=false
      - MAINTENANCE_MODE=false
      - WORKSPACE_RESTORE_RECONCILIATION_ENABLED=false
      # BASIC_CLUSTER에는 OKE workload identity가 없어 단일 노드의 instance principal을
      # OCI Vault에 연결한다. 노드 교체 시 운영 가이드의 dynamic group 갱신 절차를 따른다.
      - SECRET_PROVIDER=oci-vault
      - SECRET_PROVIDER_OCI_AUTH_MODE=instance-principal
      - SECRET_PROVIDER_OCI_REGION=ap-chuncheon-1
      - SECRET_PROVIDER_OCI_COMPARTMENT_ID=ocid1.compartment.oc1..aaaaaaaanhpqywyoflasclz3rayfhzudhwuf5nts23nkj5kj2swadwoohtoa
      - SECRET_PROVIDER_OCI_VAULT_ID=ocid1.vault.oc1.ap-chuncheon-1.gjvirh2laaau4.ab4w4ljrckxg3yhgifsvw43myu34h2vrldhi4xetcm76yfo2z3ljybqdwb6a
      - SECRET_PROVIDER_OCI_KEY_ID=ocid1.key.oc1.ap-chuncheon-1.gjvirh2laaau4.ab4w4ljrorrxfw4ahvrxlwcm5f5hiiagmj7sfzb6v5qkzdz2tcjbdaro74ua
      - SECRET_PROVIDER_OCI_RECOVERY_DAYS=7
      - BILLING_ENABLED=false
      - BILLING_RENEWAL_ENABLED=false
      - BILLING_RECONCILIATION_ENABLED=false
      - AI_USAGE_ENFORCEMENT_ENABLED=false
      # NoSQL을 활성화할 때도 Workspace 개인화가 아닌 공통 채용공고 catalog만 사용한다.
      - ORACLE_NOSQL_TABLE=JobPostingCatalogReadModel
      # core 모듈의 JobPostingCqrsEventHandler(@RabbitListener)가 api/worker 양쪽에 다 뜨는데
      # 지금까지 RABBITMQ_HOST가 어디에도 없어서 둘 다 localhost:5672로 계속 실패하고 있었다(2026-08-04).
      - RABBITMQ_HOST=self-intro-rabbitmq
