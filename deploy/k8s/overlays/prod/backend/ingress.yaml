apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: self-intro-backend
  namespace: self-intro
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # SSE 스트리밍(핵심 역량 AI): 응답 버퍼링을 끄고 모델 응답 대기 구간을 견디도록 타임아웃 연장
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "420"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "420"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.unbrdn.me
      secretName: cloudflare-origin-tls
  rules:
    - host: api.unbrdn.me
      http:
        paths:
          # job-posting AI/크롤링(URL 파싱·수집·백필 등), study-plan, 벡터 배치 동기화는 worker가
          # 직접 서빙한다 — 2026-08 CRUD/AI 분리 작업. nginx는 더 구체적인 path를 우선 매치하므로
          # 순서와 무관하게 아래 경로들이 "/" 보다 먼저 걸린다.
          - path: /api/worker/job-postings
            pathType: Prefix
            backend:
              service:
                name: self-intro-backend-worker
                port:
                  number: 8081
          - path: /api/worker/workspaces
            pathType: Prefix
            backend:
              service:
                name: self-intro-backend-worker
                port:
                  number: 8081
          - path: /api/v1/vector-sync
            pathType: Prefix
            backend:
              service:
                name: self-intro-backend-worker
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: self-intro-backend
                port:
                  number: 8080
