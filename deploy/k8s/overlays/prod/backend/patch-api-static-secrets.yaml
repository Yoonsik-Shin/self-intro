apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-intro-backend
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: oci-static-secret-bootstrap
          image: self-intro-backend
          imagePullPolicy: IfNotPresent
          command:
            - java
            - -jar
            - /app/secret-bootstrap.jar
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: OCI_CONFIG_FILE
              value: /run/oci/config
            - name: OCI_PROFILE
              value: DEFAULT
            - name: STATIC_SECRET_MANIFEST
              value: /run/static-secret-manifest/static-secret-manifest.env
            - name: STATIC_SECRET_OUTPUT_DIRECTORY
              value: /run/self-intro/static-secrets
          volumeMounts:
            - name: oci-api-static-reader-bootstrap
              mountPath: /run/oci
              readOnly: true
            - name: api-static-secret-manifest
              mountPath: /run/static-secret-manifest
              readOnly: true
            - name: api-static-secrets
              mountPath: /run/self-intro/static-secrets
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
      containers:
        - name: backend
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-db-secret
            - secretRef:
                name: backend-auth-secret
            - secretRef:
                name: backend-ai-secret
            - secretRef:
                name: backend-storage-secret
            - secretRef:
                name: backend-billing-secret
            - secretRef:
                name: backend-kofi-secret
                optional: true
          env:
            - name: STATIC_SECRET_DIRECTORY
              value: /run/self-intro/static-secrets
            - name: STATIC_SECRET_DIRECTORY_REQUIRED
              value: "true"
            - name: STATIC_SECRET_REQUIRED_KEYS
              value: SPRING_MAIL_USERNAME,SPRING_MAIL_PASSWORD
          volumeMounts:
            - name: api-static-secrets
              mountPath: /run/self-intro/static-secrets
              readOnly: true
      volumes:
        - name: oci-api-static-reader-bootstrap
          secret:
            secretName: oci-api-static-reader-bootstrap
            defaultMode: 0440
        - name: api-static-secret-manifest
          configMap:
            name: api-static-secret-manifest
            defaultMode: 0440
        - name: api-static-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
