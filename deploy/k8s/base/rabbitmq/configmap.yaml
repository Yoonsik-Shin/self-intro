apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-plugins
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
  # 원격 guest 접속은 허용하지 않는다. API와 Worker는 rabbitmq-credentials에 저장한
  # 전용 계정으로 ClusterIP에 접속하며 NetworkPolicy가 발신 Pod를 제한한다.
  rabbitmq.conf: |
    loopback_users.guest = true
