apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-intro-backend-worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: self-intro-backend-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: self-intro-backend-worker
    spec:
      imagePullSecrets:
        - name: ocir-pull-secret
      containers:
        - name: backend-worker
          image: self-intro-backend-worker
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9090
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-worker-db-secret
            - secretRef:
                name: backend-ai-secret
            - secretRef:
                name: backend-storage-secret
            - secretRef:
                name: backend-kofi-secret
                optional: true
          env:
            - name: JOB_POSTING_SCHEDULER_ENABLED
              value: "true"
          volumeMounts:
            - name: oracle-atp-wallet
              mountPath: /etc/oracle/wallet
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: oracle-atp-wallet
          secret:
            secretName: oracle-atp-worker-wallet
            optional: true

