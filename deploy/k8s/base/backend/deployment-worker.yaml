apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-intro-backend-worker
spec:
  replicas: 1
  strategy:
    type: Recreate

  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: self-intro-backend-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: self-intro-backend-worker
    spec:
      imagePullSecrets:
        - name: ocir-pull-secret
      containers:
        - name: backend-worker
          image: self-intro-backend-worker
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9090
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-worker-db-secret
            - secretRef:
                name: backend-ai-secret
            - secretRef:
                name: backend-storage-secret
            - secretRef:
                name: backend-kofi-secret
                optional: true
          # job_posting/job_posting_setting 등 관계형 데이터는 실제로 MySQL(api와 동일 DB)에 산다.
          # backend-worker-db-secret(envFrom, 위)은 이제 Oracle 26ai 2차 데이터소스 전용이고,
          # 1차 데이터소스는 backend-db-secret에서 MYSQL_* 이름으로 다시 매핑해 받는다(2026-08-04 사고 대응).
          env:
            - name: APP_RUNTIME_ROLE
              value: "worker"
            - name: INTERNAL_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-ai-secret
                  key: INTERNAL_WORKER_TOKEN
            - name: JOB_POSTING_SCHEDULER_ENABLED
              value: "true"
            - name: MYSQL_DB_URL
              valueFrom:
                secretKeyRef:
                  name: backend-db-secret
                  key: DB_URL
            - name: MYSQL_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-db-secret
                  key: DB_USERNAME
            - name: MYSQL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-db-secret
                  key: DB_PASSWORD
            - name: MYSQL_DB_DRIVER
              valueFrom:
                secretKeyRef:
                  name: backend-db-secret
                  key: DB_DRIVER
            # 어드민 로그인 계정 — worker가 /api/admin/job-postings와 Workspace StudyPlan을
            # 직접 서빙하게 되면서(2026-08 Ingress Gateway L7 라우팅) 필요해졌다.
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-db-secret
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: backend-db-secret
                  key: ADMIN_PASSWORD_HASH
          volumeMounts:
            - name: oracle-atp-wallet
              mountPath: /etc/oracle/wallet
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: oracle-atp-wallet
          secret:
            secretName: oracle-atp-worker-wallet
            optional: true
