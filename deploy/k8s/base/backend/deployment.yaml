apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-intro-backend
spec:
  replicas: 1
  strategy:
    type: Recreate

  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: self-intro-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: self-intro-backend
    spec:
      serviceAccountName: self-intro-api
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ocir-pull-secret
      containers:
        - name: backend
          image: self-intro-backend
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_RUNTIME_ROLE
              value: "api"
            - name: INTERNAL_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-ai-secret
                  key: INTERNAL_WORKER_TOKEN
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-db-secret
            - secretRef:
                name: backend-auth-secret
            - secretRef:
                name: backend-ai-secret
            - secretRef:
                name: backend-storage-secret
            # 발송 flag가 false인 동안은 없어도 기동한다. stage SMTP 검증 전에 같은 이름의
            # SealedSecret을 만들고, 검증 완료 후 config의 발송 flag를 true로 전환한다.
            - secretRef:
                name: backend-mail-secret
                optional: true
            # 토스 샌드박스 키는 API에만 주입한다. 전역 결제 gate가 false이므로
            # PLATFORM_OWNER + 지정 Workspace 예외에서만 사용할 수 있다.
            - secretRef:
                name: backend-billing-secret
            # Ko-fi 연동키 설정 (optional)
            - secretRef:
                name: backend-kofi-secret
                optional: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
