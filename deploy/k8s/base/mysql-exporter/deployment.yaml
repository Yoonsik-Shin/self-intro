apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysqld-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mysqld-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysqld-exporter
    spec:
      containers:
        - name: mysqld-exporter
          image: docker.io/prom/mysqld-exporter:latest
          args:
            - "--config.my-cnf=/etc/mysqld-exporter/.my.cnf"
          ports:
            - name: http
              containerPort: 9104
          volumeMounts:
            - name: mysqld-exporter-secret
              mountPath: /etc/mysqld-exporter
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: mysqld-exporter-secret
          secret:
            secretName: mysqld-exporter-secret
