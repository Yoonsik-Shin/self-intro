apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-sa
  namespace: self-intro
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-role
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-role
subjects:
  - kind: ServiceAccount
    name: prometheus-sa
    namespace: self-intro
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: self-intro
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: 'self-intro-backend'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 10s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - self-intro
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: self-intro-backend.*
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: application
      - job_name: 'rabbitmq'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['self-intro-rabbitmq.self-intro.svc.cluster.local:15692']
      - job_name: 'mysql'
        static_configs:
          - targets: ['mysqld-exporter.self-intro.svc.cluster.local:9104']
      - job_name: 'oracle-atp'
        static_configs:
          - targets: ['oracledb-exporter.self-intro.svc.cluster.local:9161']
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - self-intro
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.self-intro.svc.cluster.local:8080']
      - job_name: 'tempo'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['tempo.self-intro.svc.cluster.local:3200']
      # 노드별 컨테이너 실사용량(CPU/메모리) - kubelet의 cAdvisor를 API 서버
      # 프록시 경유로 스크랩. pod IP 직접 접근 불가능한 환경이라 이 방식이 표준.
      - job_name: 'cadvisor'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
  alerts.yml: |
    groups:
      - name: self-intro-capacity-and-reliability
        rules:
          - alert: SelfIntroNodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "OKE node is not Ready"
              description: "Node {{ $labels.node }} has remained NotReady for more than 5 minutes."
          - alert: SelfIntroNodeMemoryAvailableLow
            expr: node_memory_MemAvailable_bytes{job="node-exporter"} < 700 * 1024 * 1024
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "OKE node available memory is below 700 MiB"
              description: "Node {{ $labels.instance }} has had less than 700 MiB available memory for 10 minutes."
          - alert: SelfIntroNodeMemoryUsageHigh
            expr: (1 - node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"}) * 100 >= 85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "OKE node memory usage is at least 85%"
              description: "Node {{ $labels.instance }} has remained at or above 85% memory usage for 10 minutes."
          - alert: SelfIntroPodPending
            expr: kube_pod_status_phase{namespace="self-intro",phase="Pending"} > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Self-Intro pod remains Pending"
              description: "Pod {{ $labels.pod }} has remained Pending for more than 10 minutes."
          - alert: SelfIntroContainerCrashLooping
            expr: kube_pod_container_status_waiting_reason{namespace="self-intro",reason="CrashLoopBackOff"} > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Self-Intro container is crash-looping"
              description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is in CrashLoopBackOff."
          - alert: SelfIntroHpaAtMaximum
            expr: kube_horizontalpodautoscaler_status_current_replicas{namespace="self-intro"} >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="self-intro"}
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Self-Intro HPA reached its maximum"
              description: "HPA {{ $labels.horizontalpodautoscaler }} has remained at its replica ceiling for 10 minutes."
          - alert: SelfIntroPersistentVolumeClaimPending
            expr: kube_persistentvolumeclaim_status_phase{namespace="self-intro",phase="Pending"} > 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Self-Intro PVC remains Pending"
              description: "PVC {{ $labels.persistentvolumeclaim }} has remained Pending for 10 minutes."
          - alert: SelfIntroTempoDown
            expr: up{job="tempo"} == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Tempo metrics endpoint is unavailable"
              description: "Prometheus has been unable to scrape Tempo for more than 5 minutes."
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: self-intro
spec:
  storageClassName: oci-bv-paravirtualized
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: self-intro
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus-sa
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v2.54.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=15d"
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: self-intro
spec:
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: prometheus
