apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: self-intro
data:
  local-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2020-05-15
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/index-cache
      aws:
        bucketnames: ${LOKI_S3_BUCKET}
        endpoint: ${OCI_S3_ENDPOINT}
        region: ${OCI_S3_REGION}
        access_key_id: ${OCI_S3_ACCESS_KEY_ID}
        secret_access_key: ${OCI_S3_SECRET_ACCESS_KEY}
        s3forcepathstyle: true
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: s3
    limits_config:
      retention_period: 168h
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: self-intro
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/part-of: observability-legacy-recovery
spec:
  storageClassName: oci-bv-paravirtualized
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: self-intro
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: loki
          image: docker.io/grafana/loki:3.0.0
          args:
            - "-config.file=/etc/loki/local-config.yaml"
            - "-config.expand-env=true"
          envFrom:
            - secretRef:
                name: observability-object-storage-secret
          ports:
            - containerPort: 3100
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/loki
            - name: loki-data
              mountPath: /loki
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config-volume
          configMap:
            name: loki-config
        - name: loki-data
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: self-intro
spec:
  ports:
    - port: 3100
      targetPort: 3100
      name: http
  selector:
    app: loki
