apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: self-intro
data:
  config.alloy: |
    logging {
      level = "info"
    }

    local.file_match "self_intro_backend" {
      path_targets = [
        {
          "__path__" = "/var/log/containers/*self-intro-backend*.log",
          "service"  = "self-intro-backend",
          "log_type" = "application",
        },
      ]
    }

    // self-intro-backend-worker 로그 파일명도 "self-intro-backend"를 부분 문자열로
    // 포함해서 위 glob에 같이 잡히는데, service 라벨이 하드코딩돼있어서 worker 로그가
    // api 로그랑 같은 라벨로 섞여 들어갔음 - 경로에 "backend-worker" 있으면 라벨 분리.
    discovery.relabel "self_intro_backend" {
      targets = local.file_match.self_intro_backend.targets

      rule {
        source_labels = ["__path__"]
        regex         = ".*backend-worker.*"
        target_label  = "service"
        replacement   = "self-intro-backend-worker"
      }
    }

    loki.source.file "self_intro_backend" {
      targets    = discovery.relabel.self_intro_backend.output
      forward_to = [loki.write.local.receiver]
    }

    loki.write "local" {
      endpoint {
        url = "http://loki.self-intro.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: grafana-alloy
  namespace: self-intro
spec:
  selector:
    matchLabels:
      app: grafana-alloy
  template:
    metadata:
      labels:
        app: grafana-alloy
    spec:
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:v1.0.0
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - /etc/alloy/config.alloy
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/alloy
            - name: varlog
              mountPath: /var/log/containers
              readOnly: true
            - name: varlibdocker
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: alloy-config
        - name: varlog
          hostPath:
            path: /var/log/containers
        - name: varlibdocker
          hostPath:
            path: /var/log/pods
