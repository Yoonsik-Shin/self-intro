apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracledb-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: oracledb-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oracledb-exporter
    spec:
      containers:
        - name: oracledb-exporter
          image: docker.io/iamseth/oracledb_exporter:latest
          envFrom:
            - secretRef:
                name: oracledb-exporter-secret
          env:
            - name: TNS_ADMIN
              value: /etc/oracle/wallet
          ports:
            - name: http
              containerPort: 9161
          volumeMounts:
            - name: oracle-atp-wallet
              mountPath: /etc/oracle/wallet
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        # backend-worker가 이미 쓰는 ATP wallet 시크릿을 그대로 재사용한다.
        # 같은 ATP 인스턴스니까 wallet은 공용, DB 계정만 모니터링 전용으로 분리한다.
        - name: oracle-atp-wallet
          secret:
            secretName: oracle-atp-worker-wallet
