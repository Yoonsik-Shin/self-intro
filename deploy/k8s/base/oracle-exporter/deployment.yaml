apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracledb-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: oracledb-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oracledb-exporter
    spec:
      containers:
        - name: oracledb-exporter
          # iamseth/oracledb_exporter는 amd64 전용이라 arm64(OKE Ampere) 노드에서
          # exec format error로 죽음 - Oracle 공식 멀티아치 빌드로 대체.
          image: container-registry.oracle.com/database/observability-exporter:2.0.0
          # 2.0.0부터 DATA_SOURCE_NAME env var 방식 폐지, --config.file 필수.
          args:
            - "--config.file=/etc/oracledb-exporter/config.yaml"
          envFrom:
            - secretRef:
                name: oracledb-exporter-secret
          ports:
            - name: http
              containerPort: 9161
          volumeMounts:
            - name: oracle-atp-wallet
              mountPath: /etc/oracle/wallet
              readOnly: true
            - name: exporter-config
              mountPath: /etc/oracledb-exporter
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 100m
              memory: 256Mi
      volumes:
        # exporter 전용으로 새로 발급한 wallet. worker가 쓰는 기존 wallet의
        # PEM 암호를 알 수 없어(다운로드 시점에만 존재, 어디에도 기록 안 됨)
        # 새 wallet을 발급해 비밀번호를 알고 있는 상태로 관리한다.
        - name: oracle-atp-wallet
          secret:
            secretName: oracledb-exporter-wallet
        - name: exporter-config
          configMap:
            name: oracledb-exporter-config
