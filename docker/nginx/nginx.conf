worker_processes 1;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 20m;

    # k8s에서는 Ingress가 /api/worker/**만 backend-worker Service로 경로 라우팅하고 나머지는
    # backend Service로 보낸다. 로컬 docker-compose엔 그 라우팅 계층이 없어서 프론트가 항상 찍는
    # localhost:8080이 backend(api 모듈) 컨테이너 하나뿐이면 /api/worker/**가 전부 404가 난다 —
    # 이 nginx가 그 경로 분기를 로컬에서 대신한다.
    server {
        listen 80;

        location /api/worker/ {
            proxy_pass http://backend-worker:8081/api/worker/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # AI 생성 스트리밍(SSE) 엔드포인트들이 이 경로 아래 있다 — 버퍼링하면 토큰이
            # 한꺼번에 몰려 나가 스트리밍 의미가 없어진다.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://backend:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
