worker_processes 1;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 20m;

    # k8s에서는 Ingress가 /api/worker/**와 /api/v1/vector-sync/**를 backend-worker Service로
    # 경로 라우팅하고 나머지는 backend Service로 보낸다. 로컬 docker-compose에서는 이 nginx가
    # 같은 분기를 제공한다.
    server {
        listen 80;
        resolver 127.0.0.11 valid=5s ipv6=off;

        location /api/worker/ {
            set $backend_worker_upstream "http://backend-worker:8081";
            proxy_pass $backend_worker_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # AI 생성 스트리밍(SSE) 엔드포인트들이 이 경로 아래 있다 — 버퍼링하면 토큰이
            # 한꺼번에 몰려 나가 스트리밍 의미가 없어진다.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # Vector reconciliation·backfill controller는 worker artifact에만 존재한다. 이 분기가 없으면
        # 인증된 운영자 요청도 API artifact로 전달돼 404가 된다.
        location /api/v1/vector-sync/ {
            set $backend_worker_upstream "http://backend-worker:8081";
            proxy_pass $backend_worker_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location / {
            set $backend_upstream "http://backend:8080";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
