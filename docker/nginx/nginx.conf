worker_processes 1;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 20m;

    # k8s Ingress와 로컬 nginx 모두 단일 API 엔드포인트(/api/...) 뒤에서
    # backend(CRUD/일반 API)와 backend-worker(AI/스트리밍/크롤링)를 투명하게 L7 라우팅한다.
    server {
        listen 80;
        resolver 127.0.0.11 valid=5s ipv6=off;

        # Vector reconciliation·backfill
        location /api/v1/vector-sync/ {
            set $backend_worker_upstream "http://backend-worker:8081";
            proxy_pass $backend_worker_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # Job posting AI/크롤링/백필
        location ~ ^/api/admin/job-postings/(parse-url|ingest-url|ingest-images|ingest-urls|refresh-all|collect|backfill-source-urls|[0-9]+/refresh) {
            set $backend_worker_upstream "http://backend-worker:8081";
            proxy_pass $backend_worker_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # Portfolio Case Study AI Print Draft 스트리밍
        location ~ ^/api/workspaces/[^/]+/portfolio/case-studies/manage/[0-9]+/print-draft {
            set $backend_worker_upstream "http://backend-worker:8081";
            proxy_pass $backend_worker_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # Job Application AI/Matching/Private-source parsing/스트리밍
        location ~ ^/api/workspaces/[^/]+/job-applications/manage/(parse-url|parse-screenshots|[0-9]+/(print-template-draft|generate-cover-letter-draft|analyze-appeal|rematch|gap-project-documents)) {
            set $backend_worker_upstream "http://backend-worker:8081";
            proxy_pass $backend_worker_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location / {
            set $backend_upstream "http://backend:8080";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
