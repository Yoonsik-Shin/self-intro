services:
  backend-db:
    image: mysql:8.0
    container_name: self-intro-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: self_intro
      MYSQL_USER: self_intro_app
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      interval: 5s

  # Oracle ATP/26ai의 로컬 대체 DB. 운영 ATP와 완전히 분리된 Docker 볼륨에만
  # 경험·스터디 벡터를 저장하며, Oracle 전용 VECTOR_DISTANCE SQL을 그대로 검증한다.
  oracle-vector-db:
    image: container-registry.oracle.com/database/free:latest-lite
    container_name: self-intro-oracle-vector
    environment:
      - ORACLE_PWD=local_oracle_26ai
    ports:
      - "1522:1521"
    shm_size: 1g
    volumes:
      - oracle_vector_data:/opt/oracle/oradata
      - ./docker/oracle-vector/01-init-vector-schema.sql:/opt/oracle/scripts/startup/01-init-vector-schema.sql:ro
      - ./docker/oracle-vector/oracle-schema-local.sql:/opt/oracle/vector-schema/oracle-schema-local.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/checkDBStatus.sh >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: self-intro-mysqld-exporter
    command:
      - '--config.my-cnf=/etc/mysqld_exporter/.my.cnf'
    volumes:
      - ./deploy/monitoring/mysql/.my.cnf:/etc/mysqld_exporter/.my.cnf:ro
    ports:
      - "9104:9104"
    depends_on:
      backend-db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: self-intro-backend
    # 8080은 더 이상 호스트에 직접 노출하지 않는다 — nginx(로컬 전용 경로 라우팅)가 대신 8080을
    # 잡고 /api/worker/**는 backend-worker로, 나머지는 이 컨테이너로 넘긴다. 컨테이너 간 통신은
    # 그대로 backend:8080으로 붙는다(예: frontend-next의 API_INTERNAL_BASE_URL).
    env_file:
      - .env
    environment:
      - APP_RUNTIME_ROLE=api
      - SPRING_PROFILES_ACTIVE=local
      - DB_URL=jdbc:mysql://backend-db:3306/self_intro?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      - DB_USERNAME=self_intro_app
      - DB_PASSWORD=password123
      - DB_DRIVER=com.mysql.cj.jdbc.Driver
      # schema 변경은 Flyway만 담당한다. update는 migration 이력과 실제 schema를 어긋나게 한다.
      - JPA_DDL_AUTO=validate
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_PRESIGNED_ENDPOINT=http://localhost:9000
      - STORAGE_REGION=us-east-1
      - STORAGE_BUCKET=self-intro-images
      - STORAGE_PRIVATE_BUCKET=self-intro-private
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_PATH_STYLE_ACCESS=true
      - STORAGE_PUBLIC_BASE_URL=http://localhost:9000/self-intro-images
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
      - REGISTRATION_EMAIL_ENABLED=true
      - REGISTRATION_EMAIL_FROM=no-reply@self-intro.local
      - REGISTRATION_VERIFICATION_BASE_URL=http://localhost:3000/signup/verify
      - ACCOUNT_RECOVERY_EMAIL_ENABLED=true
      - ACCOUNT_RECOVERY_EMAIL_FROM=no-reply@self-intro.local
      - PASSWORD_RESET_BASE_URL=http://localhost:3000/password-reset
      - EMAIL_CHANGE_BASE_URL=http://localhost:3000/account/email-change
      - PASSWORD_RESET_TOKEN_VALID_FOR=30m
      - REGISTRATION_INVITATION_SIGNUP_BASE_URL=http://localhost:3000/signup
      - REGISTRATION_TERMS_VERSION=${REGISTRATION_TERMS_VERSION:-2026-08-12-draft}
      - REGISTRATION_PRIVACY_VERSION=${REGISTRATION_PRIVACY_VERSION:-2026-08-12-draft}
      - REGISTRATION_MARKETING_VERSION=${REGISTRATION_MARKETING_VERSION:-2026-08-12-draft}
      - WORKSPACE_INVITATION_ACCEPT_BASE_URL=http://localhost:3000/workspace-invitations
      - INVITATION_RETENTION_ENABLED=${INVITATION_RETENTION_ENABLED:-true}
      - INVITATION_RETENTION_CLOSED_FOR=${INVITATION_RETENTION_CLOSED_FOR:-30d}
      - INVITATION_RETENTION_BATCH_SIZE=${INVITATION_RETENTION_BATCH_SIZE:-500}
      - INVITATION_RETENTION_CLEANUP_CRON=${INVITATION_RETENTION_CLEANUP_CRON:-0 30 3 * * *}
      - INVITATION_RETENTION_TIME_ZONE=${INVITATION_RETENTION_TIME_ZONE:-Asia/Seoul}
      - WORKSPACE_DELETION_GRACE_PERIOD=${WORKSPACE_DELETION_GRACE_PERIOD:-30d}
      - WORKSPACE_PURGE_OBJECT_STORAGE_DELETE_ENABLED=${WORKSPACE_PURGE_OBJECT_STORAGE_DELETE_ENABLED:-false}
      - WORKSPACE_PURGE_MYSQL_DELETE_ENABLED=${WORKSPACE_PURGE_MYSQL_DELETE_ENABLED:-false}
      - WORKSPACE_PURGE_CACHE_DELETE_ENABLED=${WORKSPACE_PURGE_CACHE_DELETE_ENABLED:-false}
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-false}
      - WORKSPACE_RESTORE_RECONCILIATION_ENABLED=${WORKSPACE_RESTORE_RECONCILIATION_ENABLED:-false}
      - GRPC_WORKER_HOST=static://backend-worker:9090
      - LOCAL_REGISTRATION_INVITATION_ENABLED=true
      - LOCAL_REGISTRATION_INVITATION_CODE=${LOCAL_REGISTRATION_INVITATION_CODE:-local-invite-only}
      - PUBLICATION_RETENTION_MAX_REVISIONS=${PUBLICATION_RETENTION_MAX_REVISIONS:-20}
      - PUBLICATION_RETENTION_MINIMUM_AGE=${PUBLICATION_RETENTION_MINIMUM_AGE:-180d}
      - SPRING_SESSION_STORE_TYPE=redis
      - AUTH_RATE_LIMIT_ENABLED=true
      - AUTH_LOGIN_RATE_LIMIT_MAX_ATTEMPTS=${AUTH_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-10}
      - AUTH_LOGIN_RATE_LIMIT_WINDOW=${AUTH_LOGIN_RATE_LIMIT_WINDOW:-1m}
      - AUTH_REGISTRATION_RATE_LIMIT_MAX_ATTEMPTS=${AUTH_REGISTRATION_RATE_LIMIT_MAX_ATTEMPTS:-5}
      - AUTH_REGISTRATION_RATE_LIMIT_WINDOW=${AUTH_REGISTRATION_RATE_LIMIT_WINDOW:-10m}
      # 로컬 개발 전용 고정 키(32 zero bytes, Base64). 운영은 반드시 SealedSecret의 별도 랜덤 키를 쓴다.
      - MFA_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      - LOG_FILE_PATH=/app/logs/application.log
      - ORACLE_NOSQL_ENABLED=true
      - ORACLE_NOSQL_ENDPOINT=http://nosql:8080
      - ORACLE_NOSQL_MODE=local
      - ORACLE_NOSQL_TABLE=JobPostingCatalogReadModel
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      backend-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
      nosql:
        condition: service_healthy

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: self-intro-backend-worker
    ports:
      - "8081:8081"
      - "9091:9090"

    env_file:
      - .env
    environment:
      - APP_RUNTIME_ROLE=worker
      - SPRING_PROFILES_ACTIVE=local
      # 1차(관계형) 데이터소스 — api 모듈과 동일한 MySQL을 본다(application.yml의 MYSQL_DB_* 값).
      # docker-compose에 이게 빠져있으면 조용히 H2 인메모리로 fallback돼 job_posting 등이 재시작마다
      # 통째로 비워진다 — 실제로 이 문제였다(2026-08-07).
      - MYSQL_DB_URL=jdbc:mysql://backend-db:3306/self_intro?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      - MYSQL_DB_USERNAME=self_intro_app
      - MYSQL_DB_PASSWORD=password123
      - MYSQL_DB_DRIVER=com.mysql.cj.jdbc.Driver
      # 2차(벡터) 데이터소스 — 로컬 Oracle Database Free 26ai.
      - DB_URL=jdbc:oracle:thin:@//oracle-vector-db:1521/FREEPDB1
      - DB_USERNAME=self_intro_vector
      - DB_PASSWORD=self_intro_vector_local
      - DB_DRIVER=oracle.jdbc.OracleDriver
      - WORKSPACE_PURGE_VECTOR_DELETE_ENABLED=${WORKSPACE_PURGE_VECTOR_DELETE_ENABLED:-false}
      - WORKSPACE_PURGE_EXECUTION_ENABLED=${WORKSPACE_PURGE_EXECUTION_ENABLED:-false}
      - WORKSPACE_PURGE_EXECUTION_CRON=${WORKSPACE_PURGE_EXECUTION_CRON:-0 */10 * * * *}
      - WORKSPACE_PURGE_TIME_ZONE=${WORKSPACE_PURGE_TIME_ZONE:-Asia/Seoul}
      - WORKSPACE_PURGE_LEASE_TIMEOUT=${WORKSPACE_PURGE_LEASE_TIMEOUT:-2h}
      - WORKSPACE_PURGE_BATCH_SIZE=${WORKSPACE_PURGE_BATCH_SIZE:-10}
      - WORKSPACE_PURGE_OBJECT_STORAGE_DELETE_ENABLED=${WORKSPACE_PURGE_OBJECT_STORAGE_DELETE_ENABLED:-false}
      - WORKSPACE_PURGE_MYSQL_DELETE_ENABLED=${WORKSPACE_PURGE_MYSQL_DELETE_ENABLED:-false}
      - WORKSPACE_PURGE_CACHE_DELETE_ENABLED=${WORKSPACE_PURGE_CACHE_DELETE_ENABLED:-false}
      # schema 변경은 api 컨테이너의 Flyway만 수행한다. worker가 update로 먼저 뜨면
      # migration과 경합하므로 validate로 고정하고 api health 이후에 시작한다.
      - JPA_DDL_AUTO=validate
      # API가 발급한 presigned PUT과 Worker의 HEAD/GET/DELETE가 반드시 같은 저장소를
      # 바라봐야 한다. env_file의 운영 OCI 값을 그대로 읽으면 로컬 MinIO 업로드를
      # Worker가 찾지 못하므로 API 컨테이너와 동일한 로컬 adapter 설정을 명시한다.
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_PRESIGNED_ENDPOINT=http://localhost:9000
      - STORAGE_REGION=us-east-1
      - STORAGE_BUCKET=self-intro-images
      - STORAGE_PRIVATE_BUCKET=self-intro-private
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_PATH_STYLE_ACCESS=true
      - STORAGE_PUBLIC_BASE_URL=http://localhost:9000/self-intro-images
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - ORACLE_NOSQL_ENABLED=true
      - ORACLE_NOSQL_ENDPOINT=http://nosql:8080
      - ORACLE_NOSQL_MODE=local
      - ORACLE_NOSQL_TABLE=JobPostingCatalogReadModel
      - PDF_DRAFT_AI_TIMEOUT=${PDF_DRAFT_AI_TIMEOUT:-240s}
      - OTLP_EXPORTER_ENDPOINT=http://tempo:4318/v1/traces
    volumes:
      - backend_logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy
      backend-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nosql:
        condition: service_healthy
      oracle-vector-db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: self-intro-nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - backend-worker

  nosql:
    image: ghcr.io/oracle/nosql:latest-ce
    container_name: self-intro-nosql
    # kvlite가 부팅 시 컨테이너 hostname을 config.xml에 박아둠. 고정 안 하면
    # 재생성마다 랜덤 hostname 바뀌어서 기존 store와 영원히 어긋나 기동 멈춤.
    hostname: self-intro-nosql
    ports:
      - "8090:8080"
    environment:
      - KV_PROXY_PORT=8080
    healthcheck:
      # KVLite httpproxy는 NoSQL Data Driver 프로토콜 전용이라 일반 GET엔 항상 400을 준다.
      # -f는 400도 실패로 처리하므로 빼고, TCP 연결+응답만 확인한다.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8080"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - nosql_data:/kvroot

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: self-intro-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./deploy/monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

  # 로컬 가입 이메일 확인용 SMTP/Web UI. 운영에서는 외부 SMTP adapter로 교체한다.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: self-intro-mailpit
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true



  redis:
    image: redis:7-alpine
    container_name: self-intro-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
      interval: 5s

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: self-intro-redis-exporter
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy

  minio:
    image: minio/minio
    container_name: self-intro-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      timeout: 5s
      retries: 5
      interval: 5s

  minio-init:
    image: minio/mc
    container_name: self-intro-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/self-intro-images &&
      mc mb -p local/self-intro-private &&
      mc anonymous set download local/self-intro-images &&
      mc anonymous set none local/self-intro-private
      "

  frontend-next:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      target: deps
    container_name: self-intro-frontend-next
    # dev server가 예외 없이 정상 종료 신호를 받아 사라진 경우 자동 복구한다.
    # `docker compose stop`처럼 사용자가 명시적으로 중지한 경우에는 재시작하지 않는다.
    restart: unless-stopped
    # deps 이미지의 node_modules를 익명 볼륨에 복사해 사용한다. 재기동마다 npm install을
    # 반복하지 않고, 로컬 장기 실행에서 캐시·메모리가 크게 불어나는 Turbopack 대신
    # 캐시를 끈 webpack dev server를 사용한다.
    command: npm run dev:docker
    # 관리 route의 최초 webpack chunk 생성은 짧게 2 GiB를 넘는다. 2 GiB hard limit에서는
    # 정상 소스도 OOM 종료되므로 compile burst만 허용한다. 장기 총 사용량은 후속 Compose profile
    # 분리에서 core 외 서비스를 기본 기동 대상에서 제외해 줄인다.
    mem_limit: 3g
    mem_reservation: 1g
    volumes:
      - ./frontend-next:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_OPTIONS=--max-old-space-size=2304
      - NEXT_DISABLE_WEBPACK_CACHE=true
      # macOS / Docker 바인드 마운트 파일 변경 탐지(HMR)를 위한 폴링 옵션
      - WATCHPACK_POLLING=true
      # 브라우저(호스트)는 이 주소로 API를 호출한다.
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
      # SSR(컨테이너 내부)은 도커 네트워크 안에서 backend 서비스명으로 접근한다.
      - API_INTERNAL_BASE_URL=http://backend:8080
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: self-intro-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:latest
    container_name: self-intro-loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  grafana-alloy:
    image: grafana/alloy:latest
    container_name: self-intro-alloy
    restart: always
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./deploy/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/containers:/var/log/containers:ro
      - backend_logs:/app/logs:ro
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:latest
    container_name: self-intro-tempo
    restart: always
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./deploy/monitoring/tempo/tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:latest
    container_name: self-intro-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  mysql_data:
  oracle_vector_data:
  minio_data:
  redis_data:
  rabbitmq_data:
  nosql_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  backend_logs:
  # 익명 볼륨은 컨테이너 재생성 때마다 고아 volume을 남기므로 프런트 캐시도
  # 프로젝트 이름이 붙는 명시적 볼륨으로 관리한다.
  frontend_node_modules:
  frontend_next_cache:
