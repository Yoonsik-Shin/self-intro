services:
  backend-db:
    image: mysql:8.0
    container_name: self-intro-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: self_intro
      MYSQL_USER: self_intro_app
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      interval: 5s

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: self-intro-mysqld-exporter
    command:
      - '--config.my-cnf=/etc/mysqld_exporter/.my.cnf'
    volumes:
      - ./deploy/monitoring/mysql/.my.cnf:/etc/mysqld_exporter/.my.cnf:ro
    ports:
      - "9104:9104"
    depends_on:
      backend-db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: self-intro-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - DB_URL=jdbc:mysql://backend-db:3306/self_intro?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      - DB_USERNAME=self_intro_app
      - DB_PASSWORD=password123
      - DB_DRIVER=com.mysql.cj.jdbc.Driver
      - JPA_DDL_AUTO=update
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_PRESIGNED_ENDPOINT=http://localhost:9000
      - STORAGE_REGION=us-east-1
      - STORAGE_BUCKET=self-intro-images
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_PATH_STYLE_ACCESS=true
      - STORAGE_PUBLIC_BASE_URL=http://localhost:9000/self-intro-images
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - SPRING_SESSION_STORE_TYPE=redis
      - LOG_FILE_PATH=/app/logs/application.log
      - ORACLE_NOSQL_ENABLED=true
      - ORACLE_NOSQL_ENDPOINT=http://nosql:8080
      - ORACLE_NOSQL_MODE=local
    volumes:
      - backend_logs:/app/logs
    depends_on:
      backend-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nosql:
        condition: service_healthy

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: self-intro-backend-worker
    ports:
      - "8081:8081"
      - "9091:9090"

    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - DB_URL=jdbc:h2:mem:workerdb;MODE=Oracle
      - DB_USERNAME=sa
      - DB_PASSWORD=
      - DB_DRIVER=org.h2.Driver
      - JPA_DDL_AUTO=update
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - ORACLE_NOSQL_ENABLED=true
      - ORACLE_NOSQL_ENDPOINT=http://nosql:8080
      - ORACLE_NOSQL_MODE=local
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nosql:
        condition: service_healthy

  nosql:
    image: ghcr.io/oracle/nosql:latest-ce
    container_name: self-intro-nosql
    # kvlite가 부팅 시 컨테이너 hostname을 config.xml에 박아둠. 고정 안 하면
    # 재생성마다 랜덤 hostname 바뀌어서 기존 store와 영원히 어긋나 기동 멈춤.
    hostname: self-intro-nosql
    ports:
      - "8090:8080"
    environment:
      - KV_PROXY_PORT=8080
    healthcheck:
      # KVLite httpproxy는 NoSQL Data Driver 프로토콜 전용이라 일반 GET엔 항상 400을 준다.
      # -f는 400도 실패로 처리하므로 빼고, TCP 연결+응답만 확인한다.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8080"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - nosql_data:/kvroot

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: self-intro-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./deploy/monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro



  redis:
    image: redis:7-alpine
    container_name: self-intro-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
      interval: 5s

  minio:
    image: minio/minio
    container_name: self-intro-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      timeout: 5s
      retries: 5
      interval: 5s

  minio-init:
    image: minio/mc
    container_name: self-intro-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/self-intro-images &&
      mc anonymous set download local/self-intro-images
      "

  frontend-next:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      target: deps
    container_name: self-intro-frontend-next
    command: sh -c "npm install --prefer-offline && npm run dev"
    volumes:
      - ./frontend-next:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      # macOS / Docker 바인드 마운트 파일 변경 탐지(HMR)를 위한 폴링 옵션
      - WATCHPACK_POLLING=true
      # 브라우저(호스트)는 이 주소로 API를 호출한다.
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
      # SSR(컨테이너 내부)은 도커 네트워크 안에서 backend 서비스명으로 접근한다.
      - API_INTERNAL_BASE_URL=http://backend:8080
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: self-intro-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:latest
    container_name: self-intro-loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  grafana-alloy:
    image: grafana/alloy:latest
    container_name: self-intro-alloy
    restart: always
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./deploy/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/containers:/var/log/containers:ro
      - backend_logs:/app/logs:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: self-intro-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

volumes:
  mysql_data:
  minio_data:
  redis_data:
  rabbitmq_data:
  nosql_data:
  prometheus_data:
  loki_data:
  grafana_data:
  backend_logs:

